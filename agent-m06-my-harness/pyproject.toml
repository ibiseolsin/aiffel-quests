[project]
name = "my-harness"
version = "1.0.0"
description = "근거를 남기는 개인 에이전트 하네스 (aiffel agent-m06)"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio>=1.0,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
